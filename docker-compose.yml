version: '3.8'

services:
  genai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: upexperience-genai-local
    restart: unless-stopped
    ports:
      - "4004:4004"
    environment:
      - PORT=4004
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongo-genai:27017/upexperience_genai
      - JWT_SECRET=supersecret_staging_jwt_key_please_change
      - DEFAULT_AI_PROVIDER=gemini
      - USE_MOCK_AI=${USE_MOCK_AI:-true}
      - TUTOR_MAX_CONTEXT_MESSAGES=${TUTOR_MAX_CONTEXT_MESSAGES:-6}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY:-}
      - OPENCODE_MODEL=${OPENCODE_MODEL:-big-pickle}
      - REDIS_URL=${REDIS_URL:-redis://redis-genai:6379}
    depends_on:
      - mongo-genai
      - redis-genai
    networks:
      - genai-network

  mongo-genai:
    image: mongo:7.0
    container_name: upexperience-mongo-genai-local
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - genai-mongo-data:/data/db
    networks:
      - genai-network

  redis-genai:
    image: redis:7.2-alpine
    container_name: upexperience-redis-genai-local
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - genai-redis-data:/data
    networks:
      - genai-network

networks:
  genai-network:
    driver: bridge

volumes:
  genai-mongo-data:
  genai-redis-data:
